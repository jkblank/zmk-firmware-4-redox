# Uncomment the following lines to enable the Redox RGB Underglow
# CONFIG_ZMK_RGB_UNDERGLOW=y
# CONFIG_WS2812_STRIP=y
# CONFIG_ZMK_USB_LOGGING=y
CONFIG_NFCT_PINS_AS_GPIOS=y

# Boost BLE transmit power to +8dBm (from the nRF52840 default 0dBm) to
# improve split link margin - mitigation for frequent right-half
# disconnects during active typing (hands near/between the halves likely
# attenuating the inter-board link). Applies to both halves.
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
