# Uncomment the following lines to enable the Redox RGB Underglow
# CONFIG_ZMK_RGB_UNDERGLOW=y
# CONFIG_WS2812_STRIP=y
# CONFIG_ZMK_USB_LOGGING=y
CONFIG_NFCT_PINS_AS_GPIOS=y

# Boost BLE transmit power to +8dBm (from the nRF52840 default 0dBm) to
# improve split link margin - mitigation for frequent right-half
# disconnects during active typing (hands near/between the halves likely
# attenuating the inter-board link). Applies to both halves.
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# EXPERIMENT: the left (central) runs two simultaneous BLE roles on one
# radio - central to the right half, peripheral to the host - and under
# heavy simultaneous keypress traffic (chording) both links have been
# observed to drop at the same instant, consistent with the radio
# stalling under combined scheduling load rather than a signal-strength
# or power issue. Widening the split link's connection interval from its
# 7.5ms default to 15ms (matching the host link's own preferred max)
# gives the radio more slack between servicing each link. Only affects
# the central (left); harmless no-op on the right.
CONFIG_ZMK_SPLIT_BLE_PREF_INT=12

# Also widen the central's inbound queue for key-position events from
# the peripheral (default 5, non-blocking - a dense burst can silently
# drop events past this depth) so a burst of chorded keys is buffered
# rather than dropped while the wider interval takes effect.
CONFIG_ZMK_SPLIT_BLE_CENTRAL_POSITION_QUEUE_SIZE=20

# NEXT STEP in the same experiment: widening only the split link above
# cut dual-disconnect frequency from multiple times/hour to ~1-2x/day,
# but didn't eliminate it. The left is still also running its host-facing
# link (peripheral role) at a fast 7.5-15ms interval, competing with the
# split link for the same radio. Widening the host link's preferred
# interval too (doubling both bounds) should free further slack - the
# host OS may or may not honor this exactly, which is itself useful data.
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=12
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=24
